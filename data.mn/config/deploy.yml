# Name of your application. Used to uniquely configure containers.
service: datamn

# Name of the container image.
image: robertritz/datamn

retain_containers: 1

# Deploy to these servers.
servers:
  - 78.46.40.253

# Kamal's own registry on Ritz: the image goes to the server over SSH and
# never reaches Docker Hub (robertritz/datamn there was public).
# Port 5556 because ritz-local-registry already holds 5555.
registry:
  server: localhost:5556

# Configure builder setup.
builder:
  arch: amd64
  local: true

# Proxy configuration for SSL and routing.
proxy:
  app_port: 8080
  hosts:
    - data.mn
    - www.data.mn
  ssl: true
  forward_headers: true
  healthcheck:
    path: /

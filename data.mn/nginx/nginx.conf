worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # Explicit MIME types for data files (ensures proper Content-Type headers)
    types {
        text/csv csv;
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
        application/json json;
        text/markdown md;
    }

    # Map Accept header to preferred file extension for AI content negotiation
    map $http_accept $prefer_markdown {
        default         "";
        "~*text/markdown" "1";
        "~*text/plain"    "1";
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html index.htm;

        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_comp_level 6;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript text/markdown text/csv image/svg+xml;

        # Default cache lifetime for versioned content. HTML pages, chart
        # specs, datasets, and thumbnails keep stable URLs across rebuilds,
        # so they get a short TTL plus ETag/Last-Modified revalidation.
        # Long-lived exceptions are overridden in the locations below.
        expires 1h;

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Instant redirect from root to Mongolian homepage
        location = / {
            return 301 https://data.mn/mn;
        }

        # Direct .md URL access (e.g., /en/data/gdp-sector-trends.md)
        # Must come BEFORE the content negotiation block
        location ~ "^/(en|mn)/data/([^/]+)\.md$" {
            set $data_lang $1;
            set $data_slug $2;
            default_type "text/markdown";
            charset utf-8;
            charset_types text/markdown;
            add_header Vary "Accept";
            alias /usr/share/nginx/html/$data_lang/data/$data_slug/index.md;
        }

        # Internal location to serve .md files with correct content type
        location ~ "\.md$" {
            internal;
            default_type "text/markdown";
            charset utf-8;
            charset_types text/markdown;
            add_header Vary "Accept";
        }

        # AI-friendly content negotiation for data pages
        # Serves markdown when Accept: text/markdown or text/plain is requested
        location ~ "^/(en|mn)/data/([^/]+)/?$" {
            set $data_lang $1;
            set $data_slug $2;
            add_header Vary "Accept";

            # If markdown is preferred, rewrite to serve index.md
            if ($prefer_markdown) {
                rewrite ^ /$data_lang/data/$data_slug/index.md last;
            }

            # Default: serve HTML
            rewrite ^ /$data_lang/data/$data_slug/index.html last;
        }

        # Fingerprinted build assets (content-hashed filenames) — immutable
        location /_astro/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Static boundary file — explicitly never regenerated
        location = /maps/mongolia-aimags.json {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/index.html =404;
        }

        # Force download for data files
        location /datasets/ {
            add_header Content-Disposition 'attachment';
            try_files $uri =404;
        }
    }
}